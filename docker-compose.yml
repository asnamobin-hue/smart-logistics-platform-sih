version: '3.8'

services:
  backend:
    build: ./backend
    container_name: logistics-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - logistics-net

  frontend:
    build: ./frontend
    container_name: logistics-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - logistics-net

networks:
  logistics-net:
    driver: bridge